<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Link Drop</title>
    <style>
        body { background: #0f0f11; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #18181b; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #27272a; text-align: center; }
        input { width: 90%; padding: 12px; background: #09090b; border: 1px solid #3f3f46; color: #fff; border-radius: 6px; margin-bottom: 15px; text-align: center; font-size: 16px; text-transform: uppercase; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; color: white; }
        .hidden { display: none; }
        .btn-red { background: #e50914; }
        .btn-green { background: #22c55e; }
        .btn-orange { background: #f59e0b; }
        .link-box { background: #27272a; padding: 15px; border-radius: 6px; margin: 15px 0; font-size: 12px; word-break: break-all; border-left: 4px solid #22c55e; text-align: left; color: #a1a1aa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Netflix Link</h1>
        <div id="input-view">
            <input type="text" id="key-input" placeholder="CLM-XXXXXX">
            <button class="btn-red" onclick="claim()">Einlösen</button>
            <p id="err-msg" class="hidden" style="color:#ef4444; font-size:14px;"></p>
        </div>
        
        <div id="result-view" class="hidden">
            <p style="color:#22c55e; font-weight: bold; margin-top:0;">Dein Account ist bereit!</p>
            <div class="link-box" id="link-display"></div>
            
            <button class="btn-green" onclick="openLink()">🚀 Netflix öffnen</button>
            <button class="btn-orange" onclick="replaceAccount()">🔄 Account tot? Ersetzen</button>
            <p id="replace-msg" class="hidden" style="color:#22c55e; font-size:14px; margin-top: 10px;"></p>
        </div>
    </div>

    <script>
        let currentKey = "";
        let currentLink = "";

        window.onload = function() {
            const savedKey = localStorage.getItem('netflix_key');
            if (savedKey) {
                document.getElementById('key-input').value = savedKey;
                claim(); 
            }
        }

        async function claim() {
            currentKey = document.getElementById('key-input').value.trim();
            localStorage.setItem('netflix_key', currentKey); 

            const res = await fetch('/api/claim', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: currentKey })
            });
            const data = await res.json();
            
            if (data.success) {
                document.getElementById('input-view').classList.add('hidden');
                document.getElementById('result-view').classList.remove('hidden');
                currentLink = data.data;
                document.getElementById('link-display').innerText = currentLink;
            } else {
                const err = document.getElementById('err-msg');
                err.innerText = data.msg;
                err.classList.remove('hidden');
                localStorage.removeItem('netflix_key'); 
            }
        }

        function openLink() {
            if (currentLink) window.open(currentLink, '_blank');
        }

        async function replaceAccount() {
            const msg = document.getElementById('replace-msg');
            msg.classList.add('hidden');
            
            const res = await fetch('/api/replace', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: currentKey })
            });
            const data = await res.json();
            
            if (data.success) {
                currentLink = data.data;
                document.getElementById('link-display').innerText = currentLink;
                msg.innerText = "Account erfolgreich ersetzt!";
                msg.style.color = "#22c55e";
                msg.classList.remove('hidden');
            } else {
                msg.innerText = data.msg;
                msg.style.color = "#ef4444";
                msg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
